<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 - B2B 발주 및 주문 관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 antialiased pb-16">
    <header class="bg-slate-900 text-white py-4 px-4 shadow-md sticky top-0 z-50">
        <div class="max-w-2xl mx-auto flex justify-between items-center">
            <h1 class="text-base font-bold">📊 오늘한끼냉동 B2B 관리자</h1>
            <a href="index.html" class="text-xs bg-slate-800 text-slate-200 px-3 py-1.5 rounded-lg">스토어로 가기</a>
        </div>
    </header>

    <main class="max-w-2xl mx-auto p-4 mt-2 space-y-4">
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <span class="text-xs text-slate-500 font-medium">총 접수 발주</span>
                <div id="total_orders_count" class="text-2xl font-bold text-slate-900 mt-1">0건</div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <span class="text-xs text-slate-500 font-medium">입금 대기</span>
                <div id="pending_orders_count" class="text-2xl font-bold text-indigo-600 mt-1">0건</div>
            </div>
        </div>

        <div id="order_list_container" class="space-y-3"></div>
    </main>

    <script>
        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
        }
        const TARGET_HASH = "pchankki1234!!";

        async function checkAdminAuth() {
            if (sessionStorage.getItem('store_admin_authed') === 'true') return;
            const inputPassword = prompt('🔐 관리자 비밀번호를 입력하세요:');
            if (!inputPassword) { location.href = 'index.html'; return; }
            const hashedInput = await sha256(inputPassword);
            if (hashedInput === TARGET_HASH) {
                sessionStorage.setItem('store_admin_authed', 'true');
            } else {
                alert('비밀번호가 일치하지 않습니다.');
                location.href = 'index.html';
            }
        }
        checkAdminAuth();

        const firebaseConfig = {
            apiKey: "AIzaSyApTZXjW03-8Z2AMh8uOksT7LzM-hwX39I",
            databaseURL: "https://oneul-hankki-default-rtdb.firebaseio.com",
            projectId: "oneul-hankki"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function initRealtimeOrders() {
            db.ref('store_orders').on('value', (snapshot) => {
                const data = snapshot.val();
                let fetched = data ? (Array.isArray(data) ? data.filter(Boolean) : Object.keys(data).map(k => ({firebaseKey: k, ...data[k]}))) : [];
                renderOrders(fetched);
            });
        }

        function renderOrders(orders) {
            document.getElementById('total_orders_count').innerText = orders.length + '건';
            document.getElementById('pending_orders_count').innerText = orders.filter(o => o.status === '입금대기').length + '건';

            const container = document.getElementById('order_list_container');
            if(!orders.length) {
                container.innerHTML = `<div class="bg-white p-8 text-center text-xs text-slate-400 rounded-xl">접수된 발주 내역이 없습니다.</div>`;
                return;
            }
            container.innerHTML = orders.map(o => `
                <div class="bg-white rounded-xl p-4 border space-y-2 shadow-sm">
                    <div class="flex justify-between border-b pb-2">
                        <span class="font-bold text-indigo-600">${o.orderId || 'ORD-UNKNOWN'}</span>
                        <span class="text-xs text-slate-400">${o.date || ''}</span>
                    </div>
                    <div class="text-xs text-slate-700 space-y-1">
                        <div><strong>주문자(매장):</strong> ${o.name || ''} (${o.phone || ''})</div>
                        <div><strong>배송지:</strong> ${o.address || ''}</div>
                        <div><strong>배송메모:</strong> <span class="text-indigo-700">${o.memo || '없음'}</span></div>
                        <div><strong>품목내역:</strong><pre class="whitespace-pre-wrap font-sans text-slate-600 mt-1 bg-slate-50 p-2 rounded">${o.product || ''}</pre></div>
                        <div class="pt-1 flex justify-between items-center">
                            <strong>결제금액:</strong> <span class="font-extrabold text-emerald-600 text-sm">${Number(o.price || 0).toLocaleString()}원</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        initRealtimeOrders();
    </script>
</body>
</html>
